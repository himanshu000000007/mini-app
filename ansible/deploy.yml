---
- name: Deploy mini-app with Docker Compose
  hosts: local
  gather_facts: false
  vars:
    deploy_dir: "{{ lookup('env', 'HOME') }}/mini-deploy"
    app_image: "himanshu5452006/mini-app:latest"
    http_port: 8095

  tasks:
    - name: Create deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copy nginx config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../nginx/nginx.conf"
        dest: "{{ deploy_dir }}/nginx.conf"
        mode: "0644"

    - name: Create compose file from template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Pull images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: false

    - name: Start the stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: up_result
      changed_when: "'Started' in up_result.stderr or 'Created' in up_result.stderr or 'Recreated' in up_result.stderr"

    - name: Wait until the app responds
      ansible.builtin.uri:
        url: "http://localhost:{{ http_port }}/"
        return_content: true
      register: health
      until: health.status == 200
      retries: 20
      delay: 3

    - name: Show response
      ansible.builtin.debug:
        msg: "{{ health.content }}"
